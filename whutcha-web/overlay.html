    <script id="flight-recorder">
        (function() {
            const SUPABASE_URL = 'https://kjoffilncbybquvjytxx.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtqb2ZmaWxuY2J5YnF1dmp5dHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzM1MjgsImV4cCI6MjA5Njk0OTUyOH0.C7VSZspoYz_Qqc_cZBUCxA1citn301hub1o8NFcUefU';
            
            function sendTelemetry(msg, stack, severity = 'error') {
                try {
                    // Using native fetch (REST) so it works even if Supabase SDK crashes
                    fetch(SUPABASE_URL + '/rest/v1/telemetry_logs', {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: msg,
                            stack_trace: stack || 'No stack trace',
                            url: window.location.href,
                            user_agent: navigator.userAgent,
                            severity: severity
                        }),
                        keepalive: true // Send even if user closes the tab mid-crash
                    }).catch(e => console.error("Telemetry network error"));
                } catch(e) {}
            }

            window.onerror = function(message, source, lineno, colno, error) {
                sendTelemetry(message, error ? error.stack : `${source}:${lineno}:${colno}`);
                return false;
            };

            window.addEventListener('unhandledrejection', function(event) {
                const msg = event.reason ? (event.reason.message || event.reason) : 'Unhandled Promise Rejection';
                const stack = event.reason ? event.reason.stack : '';
                sendTelemetry(msg.toString(), stack);
            });
        })();
    </script>

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.12);
                    osc.stop(ctx.currentTime + idx * 0.12 + 0.9);
                });
            } catch(e) {
                chimeAudio.play().catch(()=>{});

                const { data, error } = await supabaseClient.storage.from('videos').createSignedUrl(videoHash, 60);

                } else {

            // Safety timeout: max 35s to prevent overlay hanging forever if video stalls

        async function connectCoStream(token) {
            mediaContainer.innerHTML = '<div class="text-white text-base font-mono-tech animate-pulse font-bold tracking-widest uppercase flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-[#a800ff]"></span>Connecting to fan via WebRTC...</div>';
            
            try {
                currentRoom = new LiveKitClient.Room();
                
                // IMPORTANT: We do NOT enable camera/mic here. Overlay is viewer-only.
                currentRoom.on('trackSubscribed', (track) => {
                    if (track.kind === 'video' || track.kind === 'audio') {
                        const element = track.attach();
                        if(track.kind === 'video') {
                            mediaContainer.innerHTML = ''; 
                            element.className = "w-full h-full object-cover";
                            mediaContainer.appendChild(element);
                        }
                    }
                });

                // Participant disconnected listener (e.g. caller or streamer hung up)
                currentRoom.on('participantDisconnected', () => {
                    if (!currentRoom || currentRoom.remoteParticipants.size === 0) {
                        hideWidget();
                    }
                });

                // If Streamer clicks "Drop Caller" in dashboard, room dies, this triggers!
                currentRoom.on('disconnected', () => {
                    hideWidget();
                });

                if (coStreamSafetyTimer) clearTimeout(coStreamSafetyTimer);
                coStreamSafetyTimer = setTimeout(() => {
                    console.warn("OBS: Co-Stream SLA hard timeout (90s) reached, auto-closing");
                    hideWidget();
                }, 90000);

                await currentRoom.connect('wss://whutcha-drgxd8d7.livekit.cloud', token);

            } catch (error) {
                console.error("[Whutcha Live Bridge 500]: Co-Stream Gateway Connection Error:", error);
                mediaContainer.innerHTML = '<div class="text-red-500 font-mono-tech text-base font-bold uppercase">Connection Failed</div>';
                setTimeout(hideWidget, 3000);
            }
        }

                        alertQueue.push({
                            id: data.payload.id || 'sim-' + Date.now(),
                            username: data.payload.username || 'Loco Kwokka 🧢',
                            amount: data.payload.amount || 1.00,
                            video_hash: data.payload.video_hash || data.payload.videoHash || 'loco-kwokka-donation.mp4',
                            status: 'approved'
                        });
                        processQueue();
                    }
                })
                .on('broadcast', { event: 'costream_approved' }, (data) => {
                    if (data && data.payload) {
                        alertQueue.push({
                            id: data.payload.id || 'sim-' + Date.now(),
                            username: data.payload.username || 'Loco Kwokka 📞',
                            amount: data.payload.amount || 50.00,
                            video_hash: data.payload.video_hash || data.payload.videoHash || 'loco-kwokka-costream.mp4',
                            status: 'approved',
                            isCoStream: true
                        });
                        processQueue();
                    }
                });

            // Local Cross-Tab Broadcast Channel (Zero-Latency Local / Sandbox Fallback)
            let localObsBc = null;
            try {
                localObsBc = new BroadcastChannel('whutcha_obs_channel_' + streamerId);
                localObsBc.onmessage = (ev) => {
                    const { event, payload } = ev.data || {};
                    if (event === 'video_approved') {
                        alertQueue.push({
                            id: payload.id || 'sim-' + Date.now(),
                            username: payload.username || 'Loco Kwokka 🧢',
                            amount: payload.amount || 1.00,
                            video_hash: payload.video_hash || payload.videoHash || 'loco-kwokka-donation.mp4',
                            status: 'approved'
                        });
                        processQueue();
                    } else if (event === 'costream_approved') {
                        alertQueue.push({
                            id: payload.id || 'sim-' + Date.now(),
                            username: payload.username || 'Loco Kwokka 📞',
                            amount: payload.amount || 50.00,
                            video_hash: payload.video_hash || payload.videoHash || 'loco-kwokka-costream.mp4',
                            status: 'approved',
                            isCoStream: true
                        });
                        processQueue();
                    } else if (event === 'obs_panic_blackout') {
                        emergencyBlackout();
                    } else if (event === 'obs_toggle_mute') {
                        const isMuted = payload ? payload.isMuted : !isOverlayAudioMuted;
                        setOverlayAudioMute(isMuted);
                    } else if (event === 'ping_test') {
                        triggerObsTestAlert();
                    } else if (event === 'request_heartbeat') {
                        sendHeartbeat();
                    }
                };
            } catch(e){}

            obsChannel
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'donations',
                    filter: `streamer_id=eq.${streamerId}` 
                }, payload => {
                    const donation = payload.new;
                    if (donation.status === 'completed' || donation.status === 'rejected') {
                        if (currentActiveDonation && currentActiveDonation.id === donation.id) {
                            hideWidget();
                        }
                        return;
                    }
                    if (donation.status !== 'approved') return;
                    
                    // Push to queue and process
                    alertQueue.push(donation);
                    processQueue();
                });

            function sendHeartbeat() {
                const hbPayload = {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    isObs: Boolean(window.obsstudio || navigator.userAgent.includes('OBS')),
                    timestamp: Date.now()
                };
                if (localObsBc) {
                    try { localObsBc.postMessage({ event: 'obs_heartbeat', payload: hbPayload }); } catch(e){}
                }
                obsChannel.send({
                    type: 'broadcast',
                    event: 'obs_heartbeat',
                    payload: hbPayload
                }).catch(() => {});
            }

            // Send immediate local heartbeat on boot
            sendHeartbeat();

            obsChannel.subscribe((status) => {
                console.log(`OBS Realtime Status: ${status}`);
                if (status === 'SUBSCRIBED') {
                    sendHeartbeat();
                    setInterval(sendHeartbeat, 10000);
                }
                if (status === 'TIMED_OUT' || status === 'CHANNEL_ERROR') {
                    setTimeout(() => { obsChannel.subscribe(); }, 3000);
                }
            });

            window.addEventListener('beforeunload', () => {
                obsChannel.send({
                    type: 'broadcast',
                    event: 'obs_disconnected',
                    payload: { timestamp: Date.now() }
                }).catch(()=>{});
            });
        }

        startListening();
    </script>
</body>
</html>
